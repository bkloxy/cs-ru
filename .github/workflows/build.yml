
name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Clean old builds
        run: |
          find "$GITHUB_WORKSPACE/builds" -maxdepth 1 -type f -name '*.cs3' -delete

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: src/**/*.gradle*

      - name: Build plugins
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson

          find . -type f -path '*/build/*.cs3' -exec cp -t "$GITHUB_WORKSPACE/builds" {} +

          if [ ! -f build/plugins.json ]; then
            echo "ERROR: build/plugins.json was not generated"
            exit 1
          fi

          cp build/plugins.json "$GITHUB_WORKSPACE/builds/plugins.json"

          if ! find "$GITHUB_WORKSPACE/builds" -maxdepth 1 -type f -name '*.cs3' -print -quit | grep -q .; then
            echo "ERROR: No .cs3 plugin files were generated"
            exit 1
          fi

      - name: Publish builds
        working-directory: builds
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "Build ${GITHUB_SHA}"
          git push origin HEAD:builds
